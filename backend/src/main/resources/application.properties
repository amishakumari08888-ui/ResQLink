# ==========================================
# SUPABASE / POSTGRESQL
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.vrhpdbpzyicgdgaargyp}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:abhishek@#88AA}

# Resilient Connection Pool (Allow server to start even if DB is initializing)
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


